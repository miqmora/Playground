<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Card Design Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .controls {
            background: #2a2a2a;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            align-items: start;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group label {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #aaaaaa;
        }

        .format-buttons {
            display: flex;
            gap: 8px;
        }

        .format-btn {
            flex: 1;
            padding: 12px 16px;
            background: #3a3a3a;
            border: 2px solid #4a4a4a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .format-btn:hover {
            background: #4a4a4a;
            border-color: #5a5a5a;
        }

        .format-btn.active {
            background: #2d5a2d;
            border-color: #3d7a3d;
            color: #ffffff;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-value {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #cccccc;
        }

        .slider-value span {
            font-weight: 700;
            color: #ffffff;
            font-size: 16px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #3a3a3a;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3d7a3d;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #4d9a4d;
            transform: scale(1.1);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3d7a3d;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        input[type="range"]::-moz-range-thumb:hover {
            background: #4d9a4d;
            transform: scale(1.1);
        }

        .canvas-container {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 600px;
        }

        .player {
            position: relative;
            border: 3px solid #1a4d1a;
            background: #1f1f1f;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .card {
            background: rgba(45, 90, 45, 0.3);
            border: 2px solid #4d9a4d;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(77, 154, 77, 0.3);
        }

        .dimensions {
            position: absolute;
            background: #1a1a1a;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #aaaaaa;
            z-index: 10;
        }

        .player-dimensions {
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: #4d9a4d;
        }

        .card-dimensions {
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: #7dc87d;
        }

        .info-panel {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-item {
            padding: 15px;
            background: #1f1f1f;
            border-radius: 8px;
            border-left: 3px solid #3d7a3d;
        }

        .info-item label {
            font-size: 12px;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 5px;
        }

        .info-item value {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Modal Card Design Tool</h1>
        
        <div class="controls">
            <div class="control-group">
                <label>Player Format</label>
                <div class="format-buttons">
                    <button class="format-btn active" data-format="16:9" data-type="player">16:9</button>
                    <button class="format-btn" data-format="1:1" data-type="player">1:1</button>
                    <button class="format-btn" data-format="9:16" data-type="player">9:16</button>
                </div>
            </div>

            <div class="control-group">
                <label>Card Format</label>
                <div class="format-buttons">
                    <button class="format-btn active" data-format="16:9" data-type="card">16:9</button>
                    <button class="format-btn" data-format="1:1" data-type="card">1:1</button>
                    <button class="format-btn" data-format="9:16" data-type="card">9:16</button>
                </div>
            </div>

            <div class="control-group">
                <label>Padding (% of shorter side)</label>
                <div class="slider-container">
                    <div class="slider-value">
                        <span id="paddingValue">10%</span>
                    </div>
                    <input type="range" id="paddingSlider" min="0" max="40" value="10" step="1">
                </div>
            </div>
        </div>

        <div class="canvas-container">
            <div class="player" id="player">
                <div class="dimensions player-dimensions" id="playerDimensions">1920 × 1080</div>
                <div class="card" id="card">
                    <div class="dimensions card-dimensions" id="cardDimensions">1728 × 972</div>
                </div>
            </div>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <label>Player Aspect Ratio</label>
                <value id="infoPlayerRatio">16:9</value>
            </div>
            <div class="info-item">
                <label>Card Aspect Ratio</label>
                <value id="infoCardRatio">16:9</value>
            </div>
            <div class="info-item">
                <label>Padding</label>
                <value id="infoPadding">10%</value>
            </div>
            <div class="info-item">
                <label>Padding Pixels</label>
                <value id="infoPaddingPx">108px</value>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const MAX_PLAYER_WIDTH = 700;
        const MAX_PLAYER_HEIGHT = 500;
        
        let playerFormat = '16:9';
        let cardFormat = '16:9';
        let paddingPercent = 10;

        // Get elements
        const player = document.getElementById('player');
        const card = document.getElementById('card');
        const paddingSlider = document.getElementById('paddingSlider');
        const paddingValue = document.getElementById('paddingValue');
        const playerDimensions = document.getElementById('playerDimensions');
        const cardDimensions = document.getElementById('cardDimensions');

        // Info panel elements
        const infoPlayerRatio = document.getElementById('infoPlayerRatio');
        const infoCardRatio = document.getElementById('infoCardRatio');
        const infoPadding = document.getElementById('infoPadding');
        const infoPaddingPx = document.getElementById('infoPaddingPx');

        // Format buttons
        const formatButtons = document.querySelectorAll('.format-btn');
        
        formatButtons.forEach(button => {
            button.addEventListener('click', () => {
                const format = button.dataset.format;
                const type = button.dataset.type;
                
                // Update active state
                document.querySelectorAll(`.format-btn[data-type="${type}"]`).forEach(btn => {
                    btn.classList.remove('active');
                });
                button.classList.add('active');
                
                // Update format
                if (type === 'player') {
                    playerFormat = format;
                } else {
                    cardFormat = format;
                }
                
                updateCanvas();
            });
        });

        // Padding slider
        paddingSlider.addEventListener('input', (e) => {
            paddingPercent = parseInt(e.target.value);
            paddingValue.textContent = `${paddingPercent}%`;
            updateCanvas();
        });

        function parseFormat(format) {
            const [width, height] = format.split(':').map(Number);
            return { width, height };
        }

        function updateCanvas() {
            // Parse player format
            const playerRatio = parseFormat(playerFormat);
            const playerAspect = playerRatio.width / playerRatio.height;
            
            // Calculate player size (fit within MAX dimensions)
            let playerWidth, playerHeight;
            if (playerAspect > 1) {
                // Landscape or square-ish
                playerWidth = Math.min(MAX_PLAYER_WIDTH, MAX_PLAYER_HEIGHT * playerAspect);
                playerHeight = playerWidth / playerAspect;
            } else {
                // Portrait
                playerHeight = Math.min(MAX_PLAYER_HEIGHT, MAX_PLAYER_WIDTH / playerAspect);
                playerWidth = playerHeight * playerAspect;
            }
            
            // Apply player size
            player.style.width = `${playerWidth}px`;
            player.style.height = `${playerHeight}px`;
            
            // Calculate padding in pixels (based on shorter side)
            const shorterSide = Math.min(playerWidth, playerHeight);
            const paddingPx = (shorterSide * paddingPercent) / 100;
            
            // Calculate available space for card
            const availableWidth = playerWidth - (paddingPx * 2);
            const availableHeight = playerHeight - (paddingPx * 2);
            
            // Parse card format
            const cardRatio = parseFormat(cardFormat);
            const cardAspect = cardRatio.width / cardRatio.height;
            
            // Calculate card size (fit within available space)
            let cardWidth, cardHeight;
            const availableAspect = availableWidth / availableHeight;
            
            if (cardAspect > availableAspect) {
                // Card is wider relative to available space
                cardWidth = availableWidth;
                cardHeight = cardWidth / cardAspect;
            } else {
                // Card is taller relative to available space
                cardHeight = availableHeight;
                cardWidth = cardHeight * cardAspect;
            }
            
            // Apply card size
            card.style.width = `${cardWidth}px`;
            card.style.height = `${cardHeight}px`;
            
            // Update dimensions text
            playerDimensions.textContent = `${Math.round(playerWidth)} × ${Math.round(playerHeight)}`;
            cardDimensions.textContent = `${Math.round(cardWidth)} × ${Math.round(cardHeight)}`;
            
            // Update info panel
            infoPlayerRatio.textContent = playerFormat;
            infoCardRatio.textContent = cardFormat;
            infoPadding.textContent = `${paddingPercent}%`;
            infoPaddingPx.textContent = `${Math.round(paddingPx)}px`;
        }

        // Initial render
        updateCanvas();
    </script>
</body>
</html>
